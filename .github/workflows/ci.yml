name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: 20

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: |
          npm install
          npm install --prefix apps/api
          npm install --prefix apps/web
          npm install --prefix apps/mobile

      - name: Lint API
        run: npm run lint:api

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Lint Web
        run: npm run lint:web

      - name: Typecheck Web
        run: npm run typecheck:web

      - name: Lint Mobile
        run: npm run lint:mobile

      - name: Typecheck Mobile
        run: npm run typecheck:mobile

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r packages/ai-matching/requirements.txt

      - name: Install Node Dependencies
        run: |
          npm install
          npm install --prefix apps/api
          npm install --prefix apps/web
          npm install --prefix apps/mobile

      - name: Prepare API environment
        run: cp apps/api/.env.example apps/api/.env

      - name: Sync Database Schema
        run: npm run db:push

      - name: Run API Tests
        run: npm run test:api

      - name: Run API E2E Tests
        run: npm run test:api:e2e

      - name: Run Web Tests
        run: npm run test:web

      - name: Run Mobile Tests
        run: npm run test:mobile

      - name: Run AI Service Tests
        run: npm run test:ai

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: lodgely/api:latest

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/ai-matching/Dockerfile
          push: true
          tags: lodgely/ai-matching:latest

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: lodgely/web:latest
